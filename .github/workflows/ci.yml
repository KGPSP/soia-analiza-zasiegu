name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
      - run: uv sync --frozen --extra dev
      - run: uv run pytest
      - run: uv run python tools/check_markdown_links.py .
      - run: uv run ruff check src tests tools

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: docker build --tag soia-analiza-zasiegu:ci .
      - run: docker run --rm soia-analiza-zasiegu:ci --help
      - run: python tools/create_ci_fixture.py .ci-data
      - name: Generate example Markdown, PDF, maps, tables and GeoPackage
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/workspace"
          soia-analiza-zasiegu:ci
          analyze --teryt 2815092 --data-dir /workspace/.ci-data
          --output /workspace/.ci-output
      - name: Verify generated example
        run: |
          test -s .ci-output/raport.md
          test -s .ci-output/raport.pdf
          test -s .ci-output/maps/lokalizacje.png
          test -s .ci-output/layers/soia_2815092.gpkg
          python -c 'import json; assert json.load(open(".ci-output/validation.json"))["validation_passed"]'

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan the complete Git history with Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          GITLEAKS_ARCHIVE="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${GITLEAKS_ARCHIVE}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${GITLEAKS_ARCHIVE}" | sha256sum --check
          tar -xzf "${GITLEAKS_ARCHIVE}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git --redact --verbose --exit-code 1 .
