[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "soia-analiza-zasiegu"
version = "1.0.0"
description = "Generator reprodukowalnych analiz zasięgu syren SOIA dla jednostek TERYT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Komenda Główna Państwowej Straży Pożarnej" },
]
dependencies = [
  "fiona==1.10.1",
  "geopandas==1.1.3",
  "jinja2==3.1.6",
  "markdown==3.10.2",
  "numpy==2.4.6",
  "openpyxl==3.1.5",
  "osmium==4.2.0",
  "pandas==3.0.3",
  "pillow==11.3.0",
  "pyarrow==21.0.0",
  "pyogrio==0.12.1",
  "pyproj==3.7.2",
  "pypdf==6.10.0",
  "rasterio==1.5.0",
  "reportlab==4.4.9",
  "requests==2.32.5",
  "pyyaml==6.0.2",
  "scipy==1.17.0",
  "shapely==2.1.2",
  "srtm.py==0.3.7",
  "weasyprint==68.0",
]

[project.optional-dependencies]
dev = [
  "jsonschema==4.25.1",
  "python-docx==1.2.0",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.15.0",
]

[project.scripts]
soia = "soia.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/soia"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905"]
